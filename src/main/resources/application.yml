quarkus:
  http:
    port: 8081
  rest-client:
    user-data-api:
      url: ${USER_DATA_API_URL}
      disable-default-mapper: true
  oidc-client:
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
    user-data-api:
      client-id: ${KEYCLOAK_CLIENT_ID}
      auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
      credentials:
        secret: ${KEYCLOAK_CLIENT_SECRET}
      grant:
        type: client
  log:
    category:
      # Enable detailed OIDC logging
      "io.quarkus.oidc":
        level: DEBUG
      "io.quarkus.oidc.runtime":
        level: TRACE

      # Show HTTP client requests to Keycloak
      "io.vertx.ext.web.client":
        level: DEBUG

      # Show token validation details
      "io.quarkus.oidc.runtime.OidcProvider":
        level: DEBUG
